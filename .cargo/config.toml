# Dropbox holds freshly written build files open (even with the folder in rules.dropboxignore), which
# breaks cargo's rename-into-place with os error 32, so build output lives outside the synced folder.
[build]
target-dir = "C:/Users/joe/.cargo/target/fastroute-gpu"
# an explicit target, as the profile training and the release workflow use: cargo hashes it
# into the symbol names, so the PGO profile only applies to builds with the same setting
target = "x86_64-pc-windows-msvc"

# Local builds: x86-64-v3 (Haswell / Zen and newer) with profile-guided optimization, ~14 % faster
# than plain release builds with identical results. The profile is the committed one the release
# workflow uses too; retrain it before pushing code changes (scripts/pgo-profile.sh). RUSTFLAGS
# overrides this.
[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "target-cpu=x86-64-v3",
    "-C", "profile-use=C:/Users/joe/Dropbox/_code/fastroute/pgo/fastroute.profdata",
]
