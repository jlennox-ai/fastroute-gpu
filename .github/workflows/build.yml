name: build

# PGO builds of every target; a tag v<version> also publishes a release. Windows uses the
# committed GPU-trained profile (pgo/); Linux trains its own on the runner (a profile only fits
# the platform it was trained on).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # the Freerouting commit fastroute is a port of; its benchmark boards train the profiles
  FREEROUTING_COMMIT: aa909a3450d2de57cb7823f2098fe38c4af67769

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86-64, runner: windows-latest, profile: committed, rustflags: "" }
          - { name: windows-avx256, runner: windows-latest, profile: committed, rustflags: "-C target-cpu=x86-64-v3" }
          - { name: linux-x86-64, runner: ubuntu-22.04, profile: trained, rustflags: "" }
          - { name: linux-avx256, runner: ubuntu-22.04, profile: trained, rustflags: "-C target-cpu=x86-64-v3" }
          - { name: linux-arm64, runner: ubuntu-22.04-arm, profile: trained, rustflags: "" }
          # the runners cannot run these: trained with an x86-64-v3 binary, not started
          - { name: windows-x86-64-novalake, runner: windows-latest, profile: committed, rustflags: "-C target-cpu=novalake", foreign_cpu: true }
          - { name: linux-x86-64-novalake, runner: ubuntu-22.04, profile: trained, rustflags: "-C target-cpu=novalake", trainflags: "-C target-cpu=x86-64-v3", foreign_cpu: true }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Versions
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          [ -n "$version" ] || { echo "no version in Cargo.toml" >&2; exit 1; }
          # versions follow fastroute's; v<version>-<n> is a further release of this fork on it
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "${GITHUB_REF_NAME#v}" | grep -qxE "$(echo "$version" | sed 's/[.]/[.]/g')(-[0-9]+)?" || {
              echo "tag $GITHUB_REF_NAME is neither v$version nor v$version-<n> (Cargo.toml: $version)" >&2
              exit 1
            }
            version=${GITHUB_REF_NAME#v}
          fi
          echo "archive=fastroute-gpu-$version-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "rustc=$(cat pgo/rustc-version)" >> "$GITHUB_OUTPUT"

      # the compiler version that wrote the committed profile, for every target
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.version.outputs.rustc }}
          components: llvm-tools-preview

      # an explicit target keeps RUSTFLAGS away from build scripts, which run on the runner
      - name: Target
        run: |
          echo "CARGO_BUILD_TARGET=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"

      - name: Build with the committed profile
        if: matrix.profile == 'committed'
        env:
          # RUSTFLAGS and CARGO_TARGET_DIR replace the local settings of .cargo/config.toml
          RUSTFLAGS: ${{ matrix.rustflags }} -C profile-use=${{ github.workspace }}\pgo\fastroute.profdata
          CARGO_TARGET_DIR: ${{ github.workspace }}\target\pgo\use
        run: cargo build --release --locked -p fastroute --features gpu

      - name: Fetch the training boards
        if: matrix.profile == 'trained'
        uses: actions/checkout@v7
        with:
          repository: freerouting/freerouting
          ref: ${{ env.FREEROUTING_COMMIT }}
          path: reference/freerouting
          sparse-checkout: scripts/benchmark/fixtures

      - name: Train a profile and build with it
        if: matrix.profile == 'trained'
        env:
          PGO_RUSTFLAGS: ${{ matrix.rustflags }}
          PGO_TRAIN_RUSTFLAGS: ${{ matrix.trainflags || matrix.rustflags }}
          PGO_FEATURES: gpu
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: sh scripts/build-pgo.sh

      - name: Package
        run: |
          archive=${{ steps.version.outputs.archive }}
          built=../target/pgo/use/$CARGO_BUILD_TARGET/release
          started=${{ matrix.foreign_cpu && 'false' || 'true' }}
          mkdir -p "dist/$archive"
          cp LICENSE NOTICE README.md "dist/$archive/"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$built/fastroute.exe" "$archive/"
            if [ "$started" = true ]; then "$archive/fastroute.exe" --version; fi
            7z a -bd "$archive.zip" "$archive"
          else
            cp "$built/fastroute" "$archive/"
            if [ "$started" = true ]; then "$archive/fastroute" --version; fi
            # NVRTC is looked up next to the executable (crates/fastroute/build.rs)
            readelf -d "$archive/fastroute" | grep -q 'Library rpath: \[\$ORIGIN\]' \
              || { echo "fastroute has no RPATH \$ORIGIN" >&2; readelf -d "$archive/fastroute" >&2; exit 1; }
            tar -czf "$archive.tar.gz" "$archive"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          version=${GITHUB_REF_NAME#v}
          [ "$(ls | wc -l)" = 7 ] || { echo "expected 7 archives:" >&2; ls >&2; exit 1; }
          sha256sum * > SHA256SUMS.txt
          cat > ../notes.md <<EOF
          * **AVX256** is faster but needs a processor from 2013 or later; otherwise use **x86-64**.
          * Setup for \`--gpu\`: [What you need for \`--gpu\`](https://github.com/$GITHUB_REPOSITORY#what-you-need-for---gpu).
          EOF
          gh release create "$GITHUB_REF_NAME" * \
            --repo "$GITHUB_REPOSITORY" \
            --title "fastroute-gpu $version" \
            --notes-file ../notes.md --generate-notes
